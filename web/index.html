<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><style>rect{fill:%23000}path{stroke:%23fff}@media (prefers-color-scheme:dark){rect{fill:%23fff}path{stroke:%23000}}</style><rect width='32' height='32' rx='7'/><path d='M9 17l4.5 4.5L23 11' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <title>Auto Reviewer</title>
    <script>
      // Apply the saved light/dark choice before the page draws, so it doesn't flash.
      try {
        var theme = localStorage.getItem('auto-reviewer.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
